<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Company</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span><span id="brandName">Virtual Company</span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="office" class="on">오피스</button>
    <button data-tab="tasks">업무</button>
    <button data-tab="chat">메신저</button>
    <button data-tab="org">조직</button>
    <button data-tab="settings">설정</button>
  </nav>
  <div class="goalbar">
    <input id="goal" placeholder="회사 목표를 입력하세요 (예: 국내 AI 에이전트 시장 조사 보고서 작성)">
    <button id="runBtn" class="primary">업무 시작</button>
  </div>
</header>
<main id="view"></main>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script src="/app.js"></script>
</body>
</html>
